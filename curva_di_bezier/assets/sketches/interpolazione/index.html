<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Primer on Bézier Curves</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: #f5f5f5;
  }
  #layout { display: flex; height: 100vh; }
  #ui {
    width: 320px;
    padding: 20px;
    border-right: 1px solid #333;
    background: #0b0b0b;
    z-index: 10;
  }
  h1 { font-size: 18px; margin-bottom: 10px; color: #fff; }
  p { font-size: 13px; color: #d6d0c4; margin-bottom: 15px; line-height: 1.4; }
  .section { margin-bottom: 15px; }
  h2 { font-size: 13px; margin-bottom: 8px; color: #d6d0c4; }
  input { width: 100%; accent-color: #d6d0c4; }
  button {
    width: 100%;
    padding: 8px;
    border: 1px solid #d6d0c4;
    background: transparent;
    color: #fff;
    cursor: pointer;
  }
  .value { font-family: monospace; margin-top: 5px; }
  #canvasWrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
  canvas {
    background: #000;
  }
  .formula { font-size: 12px; color: #d6d0c4; line-height: 1.6; }
</style>
</head>
<body>

<div id="layout">
  <div id="ui">
    <h1>A Primer on Bézier Curves</h1>
    <p>Scomposizione di De Casteljau HD con coordinate tracciate in tempo reale e interattività fluida ripristinata.</p>

    <div class="section">
      <h2>t (Parametro di controllo)</h2>
      <input id="slider" type="range" min="0" max="1" step="0.001" value="0.35">
      <div class="value" id="tValue">t = 0.350</div>
    </div>

    <div class="section">
      <button id="btn">stop</button>
    </div>

    <div class="section">
      <h2>Polinomi di Bernstein</h2>
      <div class="formula" id="weights"></div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="c"></canvas>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
